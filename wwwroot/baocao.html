<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LMS - Báo cáo Học lực</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/app.css" rel="stylesheet" />
</head>
<body>
<main id="page-main-content">
  <div id="alertBox"></div>

  <div class="page-header">
    <div>
      <h4><i class="bi bi-graph-up-arrow text-primary me-2"></i>Báo cáo Học lực</h4>
      <small class="text-muted">Thống kê GPA và xếp loại học lực toàn trường (Aggregation Pipeline)</small>
    </div>
    <button class="btn btn-outline-primary btn-sm no-print" onclick="window.print()">
      <i class="bi bi-printer me-1"></i> In báo cáo
    </button>
  </div>

  <!-- Thống kê tổng hợp -->
  <div class="row g-3 mb-4" id="bcStatCards"></div>

  <!-- Phân bố xếp loại -->
  <div class="card mb-4">
    <div class="card-header bg-white">
      <span class="fw-bold text-primary"><i class="bi bi-bar-chart-fill me-2"></i>Phân bố Xếp loại Học lực</span>
    </div>
    <div class="card-body">
      <div id="bcDistribution" class="row g-3 text-center"></div>
    </div>
  </div>

  <!-- Bảng chi tiết -->
  <div class="card">
    <div class="card-header bg-white">
      <div class="d-flex justify-content-between align-items-center">
        <span class="fw-bold text-primary"><i class="bi bi-table me-2"></i>Bảng chi tiết GPA từng sinh viên</span>
        <div class="d-flex align-items-center gap-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label small fw-semibold mb-0">Lọc theo lớp:</label>
            <select id="bcLop" class="form-select form-select-sm" onchange="loadBaoCao()" style="min-width:200px">
              <option value="">Tất cả lớp</option>
            </select>
          </div>
          <span id="bcCountBadge" class="badge bg-primary px-2 py-1">0 sinh viên</span>
        </div>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>#</th>
            <th>MSSV</th>
            <th>Họ tên</th>
            <th>Lớp</th>
            <script>if(localStorage.getItem('role')!=='giaovien')document.write('<th class="text-center">Tín chỉ tích lũy</th>')</script>
            <th class="text-center">GPA (Hệ 10)</th>
            <th class="text-center">Xếp loại</th>
          </tr>
        </thead>
        <tbody id="bcTable">
          <tr class="loading-row"><td colspan="7" class="text-center text-muted">
            <div class="spinner-border spinner-border-sm text-primary me-2"></div>Đang tải...
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/app.js"></script>
<script>
  renderLayout('baocao');
  fillLopSelects();
  loadBaoCao();
</script>
</body>
</html>
