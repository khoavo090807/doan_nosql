<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>LMS - Quản lý Sinh viên</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/app.css" rel="stylesheet" />
</head>
<body>
  <main id="page-main-content">
    <div id="alertBox"></div>
        
        <div id="sinhvien-list">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h4 class="mb-0">Quản lý Sinh viên</h4>
              <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalSinhVien" onclick="openCreateSv()">
                <i class="bi bi-plus-lg"></i> Thêm sinh viên
              </button>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-md-3">
                <select id="filterLop" class="form-select" onchange="loadSinhVien()">
                  <option value="">Tất cả lớp</option>
                </select>
              </div>
              <div class="col-md-4">
                <input id="filterQ" class="form-control" placeholder="Tìm mã / họ tên..." onkeyup="if(event.key==='Enter')loadSinhVien()" />
              </div>
              <div class="col-md-2">
                <button class="btn btn-outline-secondary w-100" onclick="loadSinhVien()">Lọc</button>
              </div>
            </div>
            <div class="table-responsive bg-white rounded shadow-sm">
              <table class="table table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th>MSSV</th><th>Họ tên</th><th>Lớp</th><th>Khoa</th><th>Trạng thái</th><th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="svTable"></tbody>
              </table>
            </div>
        </div>

        <div id="svDetail" style="display: none;">
          <button class="btn btn-outline-secondary btn-sm mb-3" onclick="showPage('list')">
            <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách
          </button>
        </div>

  </main>

  <div class="modal fade" id="modalSinhVien" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" onsubmit="saveSinhVien(event)">
        <div class="modal-header"><h5 class="modal-title" id="svModalTitle">Thêm sinh viên</h5></div>
        <div class="modal-body">
          <input type="hidden" id="svIsEdit" />
          <div id="modalSinhVien-error" class="alert alert-danger py-2 mb-2" style="display:none;"></div>
          <div class="mb-2">
            <label class="form-label fw-semibold">MSSV <span class="text-danger">*</span></label>
            <input id="svId" class="form-control" required placeholder="VD: SV2026101" />
            <div class="invalid-feedback">MSSV này đã tồn tại hoặc để trống.</div>
          </div>
          <div class="mb-2"><label class="form-label">Họ tên</label><input id="svHoTen" class="form-control" required /></div>
          <div class="mb-2"><label class="form-label">Giới tính</label>
            <select id="svGioiTinh" class="form-select"><option>Nam</option><option>Nữ</option></select>
          </div>
          <div class="mb-2"><label class="form-label">Email</label><input id="svEmail" type="email" class="form-control" /></div>
          <div class="mb-2"><label class="form-label">Điện thoại</label><input id="svDienThoai" class="form-control" /></div>
          <div class="mb-2"><label class="form-label">Lớp sinh hoạt</label><input id="svLop" class="form-control" value="14DHTH01" /></div>
          <div class="mb-2"><label class="form-label">Khoa</label><select id="svMaKhoa" class="form-select"></select></div>
          <div class="mb-2"><label class="form-label">Khóa học</label><input id="svKhoaHoc" class="form-control" value="K14" /></div>
          <div class="mb-2" id="svTrangThaiDiv" style="display:none;"><label class="form-label">Trạng thái</label>
            <select id="svTrangThai" class="form-select"><option>Đang học</option><option>Đã nghỉ</option></select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/app.js"></script>
  <script>
    renderLayout('sinhvien');
    fillLopSelects();
    loadSinhVien();
  </script>
</body>
</html>
